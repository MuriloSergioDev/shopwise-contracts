asyncapi: 3.0.0
info:
  title: Shopwise events
  version: 0.1.0
  description: Every Kafka topic, its owner and its payload schema. Envelope per ADR-0002.
servers:
  local:
    host: shopwise-kafka-bootstrap:9092
    protocol: kafka
channels:
  platform.pinged:
    address: platform.pinged
    description: "Owner: ping (service template)."
    messages:
      pinged:
        name: platform.pinged
        payload:
          $ref: ./schemas/events/platform/pinged.v1.json
  identity.customer-registered:
    address: identity.customer-registered
    description: "Owner: identity."
    messages:
      customerRegistered:
        name: identity.customer-registered
        payload:
          $ref: ./schemas/events/identity/customer-registered.v1.json
  catalog.product-published:
    address: catalog.product-published
    description: "Owner: catalog. Key: productId."
    messages:
      productPublished:
        name: catalog.product-published
        payload:
          $ref: ./schemas/events/catalog/product-published.v1.json
  catalog.variant-changed:
    address: catalog.variant-changed
    description: "Owner: catalog. Key: productId (keeps a product's variant changes in order)."
    messages:
      variantChanged:
        name: catalog.variant-changed
        payload:
          $ref: ./schemas/events/catalog/variant-changed.v1.json
  pricing.price-changed:
    address: pricing.price-changed
    description: "Owner: pricing. Key: sku."
    messages:
      priceChanged:
        name: pricing.price-changed
        payload:
          $ref: ./schemas/events/pricing/price-changed.v1.json
operations:
  publishPinged:
    action: send
    channel: { $ref: "#/channels/platform.pinged" }
  publishCustomerRegistered:
    action: send
    channel: { $ref: "#/channels/identity.customer-registered" }
  publishProductPublished:
    action: send
    channel: { $ref: "#/channels/catalog.product-published" }
  publishVariantChanged:
    action: send
    channel: { $ref: "#/channels/catalog.variant-changed" }
  publishPriceChanged:
    action: send
    channel: { $ref: "#/channels/pricing.price-changed" }
